<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72" viewBox="0 0 100 100" role="img" aria-label="GrowthSync icon">
  <defs>
    <linearGradient id="gs-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8F3F"/>
      <stop offset="50%" stop-color="#F26B1F"/>
      <stop offset="100%" stop-color="#C84F0E"/>
    </linearGradient>
    <radialGradient id="gs-hl" cx="0.3" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gs-inset-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
