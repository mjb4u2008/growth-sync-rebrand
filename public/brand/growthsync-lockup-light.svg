<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="540" height="100" role="img" aria-label="GrowthSync">
  <defs>
    <linearGradient id="gs-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF8F3F"/>
      <stop offset="50%" stop-color="#F26B1F"/>
      <stop offset="100%" stop-color="#C84F0E"/>
    </linearGradient>
    <radialGradient id="gs-hl" cx="0.3" cy="0.25" r="0.5">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gs-inset-top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="6%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gs-inset-bot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.18"/>
      <stop offset="6%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Sphere: 80px diameter, vertically centered. -->
  <g transform="translate(10, 10) scale(0.8)">
    <circle cx="50" cy="50" r="48" fill="url(#gs-base)" stroke="#8C2F0C" stroke-width="2"/>
    <circle cx="50" cy="50" r="47" fill="url(#gs-hl)"/>
    <circle cx="50" cy="50" r="47" fill="url(#gs-inset-top)"/>
    <circle cx="50" cy="50" r="47" fill="url(#gs-inset-bot)"/>
  </g>
  <!-- Wordmark. Hanken Grotesk 900 with system fallback (file is rendered as <img> when imported externally, so the page's webfont may not load - system-ui falls back acceptably for non-app surfaces). -->
  <text
    x="110"
    y="68"
    font-family="'Hanken Grotesk', system-ui, -apple-system, sans-serif"
    font-weight="900"
    font-size="64"
    fill="#FFFFFF"
    letter-spacing="-0.05em"
  >GrowthSync</text>
</svg>
